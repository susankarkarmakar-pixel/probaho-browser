name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies from lockfile
        working-directory: app
        run: npm ci --audit=false --fund=false

      - name: Build React app
        working-directory: app
        run: npm run build

      - name: Test security and platform contracts
        working-directory: app
        run: npm run test:unit

      - name: Check Electron-side JavaScript
        working-directory: app
        shell: bash
        run: for file in electron/*.js; do node --check "$file"; done

  e2e:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies from lockfile
        working-directory: app
        run: npm ci --audit=false --fund=false

      - name: Run Electron end-to-end tests
        working-directory: app
        run: xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probaho-browser-e2e-report
          path: |
            app/playwright-report
            app/test-results
          if-no-files-found: ignore
          retention-days: 14

  package:
    needs: [smoke-test, e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm run dist:win
            artifact_name: probaho-browser-windows
            artifact_path: app/release/*.exe
          - os: macos-latest
            build_cmd: npm run dist:mac -- --publish never
            artifact_name: probaho-browser-macos
            artifact_path: app/release/*.dmg
          - os: ubuntu-latest
            build_cmd: npm run dist:linux
            artifact_name: probaho-browser-linux
            artifact_path: |
              app/release/*.AppImage
              app/release/*.deb
              app/release/*.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies from lockfile
        working-directory: app
        run: npm ci --audit=false --fund=false

      - name: Build React app
        working-directory: app
        run: npm run build

      - name: Package application
        working-directory: app
        run: ${{ matrix.build_cmd }}

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: probaho-browser-*
          merge-multiple: true
          path: release

      - name: Publish one GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
