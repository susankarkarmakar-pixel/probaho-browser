name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies from lockfile
        working-directory: app
        run: npm ci --audit=false --fund=false

      - name: Build React app
        working-directory: app
        run: npm run build

      - name: Test security and platform contracts
        working-directory: app
        run: npm run test:unit

      - name: Check Electron-side JavaScript
        working-directory: app
        shell: bash
        run: for file in electron/*.js; do node --check "$file"; done

  e2e:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies from lockfile
        working-directory: app
        run: npm ci --audit=false --fund=false

      - name: Run Electron end-to-end tests
        working-directory: app
        run: xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probaho-browser-e2e-report
          path: |
            app/playwright-report
            app/test-results
          if-no-files-found: ignore
          retention-days: 14

  package:
    needs: [smoke-test, e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm run dist:win
            artifact_name: probaho-browser-windows
            artifact_path: |
              app/release/*.exe
              app/release/*.yml
              app/release/*.blockmap
              app/release/SHA256SUMS-*.txt
          - os: macos-latest
            build_cmd: npm run dist:mac -- --publish never
            artifact_name: probaho-browser-macos
            artifact_path: |
              app/release/*.dmg
              app/release/*.yml
              app/release/*.blockmap
              app/release/SHA256SUMS-*.txt
          - os: macos-latest
            build_cmd: npm run dist:mac -- --x64 --publish never
            artifact_name: probaho-browser-macos-x64
            artifact_path: |
              app/release/*.dmg
              app/release/*.yml
              app/release/*.blockmap
              app/release/SHA256SUMS-*.txt
          - os: ubuntu-latest
            build_cmd: npm run dist:linux
            artifact_name: probaho-browser-linux
            artifact_path: |
              app/release/*.AppImage
              app/release/*.deb
              app/release/*.tar.gz
              app/release/*.yml
              app/release/*.blockmap
              app/release/SHA256SUMS-*.txt

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies from lockfile
        working-directory: app
        run: npm ci --audit=false --fund=false

      - name: Build React app
        working-directory: app
        run: npm run build

      - name: Verify signing configuration for tagged releases
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Linux'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            [[ -n "$WIN_CSC_LINK" && -n "$WIN_CSC_KEY_PASSWORD" ]] || { echo "Windows signing secrets are required for tagged releases."; exit 1; }
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            [[ -n "$MAC_CSC_LINK" && -n "$MAC_CSC_KEY_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]] || { echo "macOS signing and notarization secrets are required for tagged releases."; exit 1; }
          fi

      - name: Package application
        working-directory: app
        env:
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.build_cmd }}

      - name: Create SHA-256 checksums
        working-directory: app
        run: npm run checksums -- "release/SHA256SUMS-${{ matrix.artifact_name }}.txt"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: probaho-browser-*
          merge-multiple: true
          path: release

      - name: Verify SHA-256 checksums
        working-directory: release
        shell: bash
        run: |
          for checksum_file in SHA256SUMS-*.txt; do
            sha256sum -c "$checksum_file"
          done

      - name: Publish one GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
