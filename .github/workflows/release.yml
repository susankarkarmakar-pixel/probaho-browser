name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd app && npm ci
      - name: Build Windows .exe
        run: cd app && npm run build && npm run build:win
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: probaho-windows
          path: app/dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd app && npm ci
      - name: Build Linux AppImage/Deb
        run: cd app && npm run build && npm run build:linux
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: probaho-linux
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            probaho-windows/*.exe
            probaho-linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
